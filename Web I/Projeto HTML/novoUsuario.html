<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Novo Usuário</h1>

    <table border="1">
        <tr>
            <td>
                <form action="mensagemCadastro.html" method="get" id="form">

                    <label for="inome">Nome:</label>
                    <input type="text" name="Nome" id="inome" required>
                    <br><br>

                    <label for="isexo">Sexo: </label>

                    <input type="radio" name="sexo" id="imas" value="Masculino" required>
                    <label for="imas">Masculino</label>
                    <input type="radio" name="sexo" id="ifem" value="Feminino">
                    <label for="ifem">Feminino</label>
                    <br><br>

                    <label for="iobs">Observações:</label><br>
                    <textarea name="obs" id="iobs"></textarea><br><br>

                    <label for="iemail">E-mail:</label>
                    <input type="email" name="email" id="iemail" required><br><br>

                    <label for="isenha">Senha:&nbsp;</label>
                    <input type="password" name="senha" id="isenha" minlength="8" required><br><br>

                    <label for="isenhaC">Confirmar Senha:</label>
                    <input type="password" name="senhaC" id="isenhaC" minlength="8" required><br><br>

                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <button type="submit">Cadastrar</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <button type="reset">Limpar</button>

                </form>
            </td>
        </tr>
    </table>

</body>
</html>
