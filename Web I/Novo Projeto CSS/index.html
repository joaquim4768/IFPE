<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <header>
        <h1>Login</h1>
    </header>

    <div class="container">
        <form action="telaPrincipal.html" method="get">
            <label for="iusuario">Usuário:</label>
            <input type="text" name="usuario" id="iusuario" required>

            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" required>

            <button type="submit">Entrar</button>
            
            <div class="links">
                <a href="recuperarSenha.html">Esqueceu a senha</a>
                <a href="novoUsuario.html">Novo</a>
            </div>
            
        </form>
    </div>
</body>
</html>
